<html>

<head>
    <title>Router Detail</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
    <h1>Router: {{ ip }}</h1>
    <table>
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Interface</th>
                <th>IP Address</th>
                <th>Status</th>
                <th>Protocol</th>
            </tr>
        </thead>
        <tbody>
            {% for interface in record %}
            {% for int in interface.interfaces %}
            <tr>
                <td>
                    {{ interface.timestamp }}
                </td>
                <td>
                    {{ int.interface }}
                </td>
                <td>
                    {{ int.ip_address }}
                </td>
                <td>
                    {{ int.status }}
                </td>
                <td>
                    {{ int.proto }}
                </td>
            </tr>
            {% endfor %}
            {% endfor %}
        </tbody>
    </table>

</body>

</html>
